[project]
name = "tutor-py-tools"
version = "0.1.0"
description = "Python tools for the tutoring system (REPL worker, math utilities)"
requires-python = ">=3.9"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python_tools"]

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[package]
name = "rlm_ws"
version = "0.1.0"
edition = "2021"
description = "Content-addressable object store for RLM workspaces"

[dependencies]
sha2 = ">=0.10.6, <0.11"
serde = { version = ">=1.0.193, <1.1", features = ["derive"] }
serde_json = ">=1.0.108, <1.1"
bincode = ">=1.3.3, <1.4"
chrono = { version = ">=0.4.31, <0.4.39", default-features = false, features = ["std", "clock", "serde"] }
thiserror = ">=1.0.50, <1.1"
tempfile = ">=3.8, <3.13"
rusqlite = { version = ">=0.30, <0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = ">=3.8, <3.13"

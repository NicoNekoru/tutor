[package]
name = "rlm_ws"
version = "0.1.0"
edition = "2021"
description = "Content-addressable object store for RLM workspaces"
rust-version = "1.83"

[lib]
name = "rlm_ws"
crate-type = ["cdylib", "rlib"]

# lib produces both cdylib (for maturin/Python) and rlib (for cargo test).
# Without the "python" feature, pyo3 is not compiled, so the cdylib has no
# Python symbol references and links cleanly without a Python installation.

[features]
default = []
# Enable Python bindings. Activated automatically by maturin via pyproject.toml.
python = ["pyo3"]

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
thiserror = "2"
tempfile = "3"
rusqlite = { version = "0.38", features = ["bundled"] }
# Optional: only pulled in when the "python" feature is active.
pyo3 = { version = "0.28", features = ["extension-module"], optional = true }

[dev-dependencies]
tempfile = "3"

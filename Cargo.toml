[package]
name = "rlm_ws"
version = "0.1.0"
edition = "2021"
description = "Content-addressable object store for RLM workspaces"
rust-version = "1.83"

[lib]
name = "rlm_ws"
crate-type = ["cdylib", "rlib"]

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned to 1.x: bincode 2 dropped serde, our on-disk format depends on it.
bincode = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
thiserror = "2"
tempfile = "3"
rusqlite = { version = "0.38", features = ["bundled"] }
pyo3 = { version = "0.28", features = ["extension-module"] }

[dev-dependencies]
tempfile = "3"
